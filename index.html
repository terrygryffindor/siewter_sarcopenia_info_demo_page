<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World Terence</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: #222;
      background: linear-gradient(180deg, #eef3fd 0%, #fafafa 100%);
      text-align: center;
    }
    .landing { max-width: 480px; width: 100%; }
    .landing img {
      width: 100%;
      max-width: 320px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(31, 58, 95, 0.18);
    }
    h1 {
      margin: 28px 0 8px;
      font-size: 2rem;
      color: #1f3a5f;
    }
    p { margin: 0 0 28px; color: #555; }
    .enter-btn {
      display: inline-block;
      padding: 14px 36px;
      border-radius: 999px;
      background: #1f3a5f;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .enter-btn:hover { background: #2c5282; transform: translateY(-2px); }
    .enter-btn:focus-visible { outline: 3px solid #8fb3ff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="landing">
    <img src="src_image/doctor_doraemon.jpg" alt="Doctor Doraemon">
    <h1>Hello World Terence</h1>
    <p>Welcome! Click below to get started.</p>
    <a class="enter-btn" href="main/">Enter</a>
  </main>
</body>
</html>
