<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World Terence</title>
  <link rel="stylesheet" href="sudoku.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      color: #222;
      background: #fafafa;
      /* Keep the footer at the bottom even when the content is short */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .layout { flex: 1; width: 100%; }

    /* Game area (shared by any game placed here) */
    .game {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 8px 16px 32px;
      text-align: center;
    }
    .game h2 { margin: 0 0 4px; color: #1f3a5f; }
    .game-status { margin: 0 0 16px; color: #555; font-weight: 600; }

    /* Flying plane strip */
    .sky {
      position: relative;
      height: 72px;
      overflow: hidden;
      border-top: 1px dashed #d5dbe3;
    }
    .plane {
      position: absolute;
      top: 12px;
      left: 0;
      color: #1f3a5f;
      animation: fly 16s linear infinite;
    }
    .plane svg {
      display: block;
      animation: bob 2.4s ease-in-out infinite alternate;
    }
    .plane .trail { opacity: 0.45; }
    .plane .prop {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 0.25s linear infinite;
    }
    @keyframes fly {
      from { transform: translateX(-160px); }
      to   { transform: translateX(100vw); }
    }
    @keyframes bob {
      from { transform: translateY(-6px) rotate(-2deg); }
      to   { transform: translateY(6px)  rotate(2deg); }
    }
    @keyframes spin {
      from { transform: scaleY(1); }
      50%  { transform: scaleY(0.2); }
      to   { transform: scaleY(1); }
    }
    /* Visitors who turn off animations see the plane parked, not moving */
    @media (prefers-reduced-motion: reduce) {
      .plane, .plane svg, .plane .prop { animation: none; }
      .plane { left: 16px; }
    }

    /* Footer */
    footer {
      background: #1f3a5f;
      color: #cfd8e3;
      padding: 12px 16px;
      font-size: 0.9rem;
    }
    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      text-align: left;
    }

    /* Header */
    header {
      background: #1f3a5f;
      color: #fff;
      padding: 0 16px;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 24px;
    }
    header h1 {
      margin: 0;
      padding: 16px 0;
      font-size: 1.4rem;
    }
    .home-link { color: inherit; text-decoration: none; }
    .home-link:hover { text-decoration: underline; }

    /* Tabs */
    nav { display: flex; gap: 4px; }
    nav button {
      font: inherit;
      color: #cfd8e3;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 18px 14px 15px;
      cursor: pointer;
    }
    nav button:hover { color: #fff; }
    nav button[aria-selected="true"] {
      color: #fff;
      border-bottom-color: #fff;
      font-weight: 600;
    }

    /* Layout: sidebar + content */
    .layout {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 16px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 32px;
      align-items: start;
    }

    /* Page index sidebar */
    .page-index {
      position: sticky;
      top: 16px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
    }
    .page-index h2 {
      margin: 0 0 8px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #666;
    }
    .page-index ul { list-style: none; margin: 0; padding: 0; }
    .page-index ul ul { padding-left: 14px; }
    .page-index a {
      display: block;
      padding: 6px 10px;
      border-left: 3px solid transparent;
      border-radius: 0 4px 4px 0;
      color: #333;
      text-decoration: none;
    }
    .page-index ul ul a { font-size: 0.9rem; color: #555; padding: 4px 10px; }
    .page-index a:hover { background: #f0f3f7; }
    .page-index a.active {
      border-left-color: #1f3a5f;
      background: #eef3fd;
      color: #1f3a5f;
      font-weight: 600;
    }

    /* Content */
    main { min-width: 0; }
    main h2:first-child { margin-top: 0; }
    section[hidden] { display: none; }

    /* Phones: stack the index above the content */
    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; gap: 20px; }
      .page-index { position: static; }
    }

    .source-text p { margin: 0 0 1em; }

    /* Image on the top right, with text wrapping around it */
    .float-right {
      float: right;
      width: 40%;
      max-width: 280px;
      height: auto;
      margin: 0 0 16px 24px;
      border-radius: 8px;
    }
    section::after { content: ""; display: block; clear: both; }

    @media (max-width: 480px) {
      .float-right { width: 45%; margin-left: 16px; }
    }

    .links { list-style: none; padding: 0; }
    .links li { margin: 12px 0; }
    .links a {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #0b57d0;
      text-decoration: none;
    }
    .links a:hover { background: #eef3fd; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1><a href="../" class="home-link">Hello World Terence</a></h1>
      <nav role="tablist">
        <button role="tab" id="tab-home" aria-controls="home" aria-selected="true">Home</button>
        <button role="tab" id="tab-links" aria-controls="links" aria-selected="false">Links</button>
      </nav>
    </div>
  </header>

  <div class="layout">
  <aside class="page-index" aria-label="Page index">
    <h2>Page Index</h2>
    <ul id="index-list"></ul>
  </aside>

  <main>
    <section id="home" role="tabpanel" aria-labelledby="tab-home">
      <img class="float-right" src="../src_image/doctor_doraemon.jpg" alt="Doctor Doraemon">
      <div id="source-text" class="source-text">Loading…</div>
    </section>

    <section id="links" role="tabpanel" aria-labelledby="tab-links" hidden>
      <h2>Links</h2>
      <ul class="links">
        <li><a href="https://www.google.com" target="_blank" rel="noopener">Link 1</a></li>
        <li><a href="https://www.google.com" target="_blank" rel="noopener">Link 2</a></li>
        <li><a href="https://www.google.com" target="_blank" rel="noopener">Link 3</a></li>
        <li><a href="https://www.google.com" target="_blank" rel="noopener">Link 4</a></li>
      </ul>
    </section>
  </main>
  </div>

  <!-- ============ Sudoku game ============ -->
  <!-- Styles: sudoku.css · Logic: sudoku.js (the 81 squares are built by the script) -->
  <section class="game" aria-labelledby="sudoku-title">
    <h2 id="sudoku-title">Sudoku</h2>
    <p id="sudoku-status" class="game-status" aria-live="polite">&nbsp;</p>

    <div class="sudoku-controls">
      <label>
        Difficulty
        <select id="sudoku-difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </label>
      <button class="sudoku-btn" id="sudoku-new">New game</button>
      <button class="sudoku-btn secondary" id="sudoku-check">Check</button>
      <button class="sudoku-btn secondary" id="sudoku-reveal">Reveal solution</button>
    </div>

    <div class="sudoku-board" id="sudoku-board"></div>
  </section>

  <script src="sudoku.js"></script>

  <!-- Decorative stick-drawn plane flying along the bottom strip -->
  <div class="sky" aria-hidden="true">
    <div class="plane">
      <svg viewBox="0 0 140 44" width="140" height="44" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- contrail -->
        <path class="trail" d="M2 24 H56" stroke-dasharray="4 6"/>
        <g transform="translate(60 0)">
          <!-- body -->
          <path d="M6 20 L62 20 Q74 20 74 24 Q74 28 64 28 L12 28 Z"/>
          <!-- tail fin -->
          <path d="M6 20 L2 6 L11 6 L19 20"/>
          <!-- wing -->
          <path d="M32 25 L22 40 L31 40 L48 25"/>
          <!-- windows -->
          <circle cx="44" cy="23.5" r="1.2"/>
          <circle cx="52" cy="23.5" r="1.2"/>
          <circle cx="60" cy="23.5" r="1.2"/>
          <!-- propeller -->
          <path class="prop" d="M76 16 V32"/>
        </g>
      </svg>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <span id="local-time">&nbsp;</span>
    </div>
  </footer>

  <script>
    // Load the home page text from src_text/source_text.txt.
    // Blank lines in the file separate paragraphs.
    fetch('../src_text/source_text.txt')
      .then(res => {
        if (!res.ok) throw new Error(res.status);
        return res.text();
      })
      .then(text => {
        const box = document.getElementById('source-text');
        box.textContent = '';
        text.trim().split(/\n\s*\n/).forEach(para => {
          const p = document.createElement('p');
          p.textContent = para.trim();
          box.appendChild(p);
        });
      })
      .catch(() => {
        document.getElementById('source-text').textContent =
          'Could not load src_text/source_text.txt.';
      });

    const tabs = document.querySelectorAll('[role="tab"]');

    const indexList = document.getElementById('index-list');

    function showTab(id) {
      tabs.forEach(tab => {
        const selected = tab.getAttribute('aria-controls') === id;
        tab.setAttribute('aria-selected', selected);
        document.getElementById(tab.getAttribute('aria-controls')).hidden = !selected;
      });
      indexList.querySelectorAll(':scope > li > a').forEach(a => {
        a.classList.toggle('active', a.dataset.tab === id);
      });
    }

    function goToTab(id) {
      showTab(id);
      history.replaceState(null, '', '#' + id);
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => goToTab(tab.getAttribute('aria-controls')));
    });

    // Build the page index: one entry per tab, plus a sub-entry for
    // every <h3> inside that tab's section (added automatically).
    tabs.forEach(tab => {
      const id = tab.getAttribute('aria-controls');
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = tab.textContent;
      a.dataset.tab = id;
      a.addEventListener('click', e => {
        e.preventDefault();
        goToTab(id);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      li.appendChild(a);

      const headings = document.getElementById(id).querySelectorAll('h3');
      if (headings.length) {
        const sub = document.createElement('ul');
        headings.forEach((h, i) => {
          if (!h.id) h.id = id + '-' + (i + 1);
          const subLi = document.createElement('li');
          const subA = document.createElement('a');
          subA.href = '#' + h.id;
          subA.textContent = h.textContent;
          subA.addEventListener('click', e => {
            e.preventDefault();
            goToTab(id);
            h.scrollIntoView({ behavior: 'smooth' });
          });
          subLi.appendChild(subA);
          sub.appendChild(subLi);
        });
        li.appendChild(sub);
      }
      indexList.appendChild(li);
    });
    showTab('home');

    // Footer clock: the visitor's own date/time and time zone,
    // taken from their device settings. Updates every second.
    const timeEl = document.getElementById('local-time');
    const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const fmt = new Intl.DateTimeFormat(undefined, {
      weekday: 'short', day: 'numeric', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      timeZoneName: 'short'
    });
    function updateClock() {
      timeEl.textContent = fmt.format(new Date()) + ' (' + zone.replace(/_/g, ' ') + ')';
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Open the tab named in the URL (e.g. .../#links), otherwise Home
    const start = location.hash.slice(1);
    if (document.getElementById(start)?.getAttribute('role') === 'tabpanel') {
      showTab(start);
    }
  </script>
</body>
</html>
